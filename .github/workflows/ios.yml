name: iOS

on: push

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Which Xcode is active
        run: xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild test \
            -project "Rick&Morty.xcodeproj" \
            -scheme "Rick&Morty" \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
